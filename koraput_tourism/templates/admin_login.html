<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Koraput Tourism Administration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gradient-to-br from-emerald-950 via-gray-900 to-emerald-900 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/20">
    
    <!-- Top Branding -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-600 flex items-center justify-center text-3xl mb-3 shadow-inner">
        🔒
      </div>
      <span class="text-[11px] font-bold uppercase tracking-widest text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full">
        District Administration
      </span>
      <h1 class="text-2xl font-extrabold text-gray-900 mt-2">Koraput Tourism Portal</h1>
      <p class="text-xs text-gray-500 mt-1">Official Content & Hospitality Management System</p>
    </div>

    <!-- Login Form -->
    <form id="adminLoginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Admin Username</label>
        <div class="relative">
          <input 
            id="adminUsername" 
            type="text" 
            required 
            value="admin"
            class="w-full text-sm p-3.5 pl-10 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-emerald-500 transition" 
            placeholder="Enter admin username"
          />
          <div class="absolute left-3.5 top-3.5 text-gray-400">👤</div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Access Passkey</label>
        <div class="relative">
          <input 
            id="adminPassword" 
            type="password" 
            required 
            value=""
            class="w-full text-sm p-3.5 pl-10 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-emerald-500 transition" 
            placeholder="Enter password"
          />
          <div class="absolute left-3.5 top-3.5 text-gray-400">🔑</div>
        </div>
      </div>

      <div id="loginErrorMsg" class="hidden text-xs text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-200">
        <!-- Error text -->
      </div>

      <button 
        type="submit" 
        class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-md transition flex items-center justify-center space-x-2"
      >
        <span>Sign In to Admin Workspace</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>

      <div class="pt-2 text-center">
        <!-- <button 
          type="button" 
          onclick="quickBypass()" 
          class="text-xs text-amber-700 hover:text-amber-800 font-semibold underline"
        >
          ⚡ 1-Click Quick Demo Access (District Officer Pass)
        </button> 
      -->
      </div>
    </form>

    <div class="mt-8 pt-6 border-t border-gray-100 text-center">
      <a href="/" class="text-xs text-emerald-800 hover:text-emerald-900 font-medium inline-flex items-center">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Return to Public Tourism Experience
      </a>
    </div>

  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('adminUsername').value.trim();
      const pass = document.getElementById('adminPassword').value.trim();
      await doLogin(username, pass);
    });

    async function quickBypass() {
      await doLogin('admin', 'korap', true);
    }

    async function doLogin(username, password, quick = false) {
      const errBox = document.getElementById('loginErrorMsg');
      errBox.classList.add('hidden');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, quick_admin: quick })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('koraput_admin_token', data.token);
          window.location.href = '/admin';
        } else {
          errBox.textContent = data.message || 'Invalid admin credentials.';
          
        }
      } catch (err) {
        errBox.textContent = 'Server connection error. Please ensure app is running.';
        errBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
